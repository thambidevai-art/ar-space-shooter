name: Build AR Shooter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Capacitor App
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "ARSpaceShooter" "com.eighthundredretail.arshooter" --web-dir www
          npx cap add android

      - name: Configure AndroidManifest (Permissions & Orientation)
        run: |
          node -e '
            const fs = require("fs");
            const file = "android/app/src/main/AndroidManifest.xml";
            let content = fs.readFileSync(file, "utf8");
            
            const perms = `
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" />
              <uses-feature android:name="android.hardware.gyroscope" />
            `;
            content = content.replace("<application", perms + "\n    <application");
            content = content.replace("android:name=\".MainActivity\"", "android:name=\".MainActivity\" android:screenOrientation=\"sensorLandscape\"");
            
            fs.writeFileSync(file, content);
          '

      - name: Configure MainActivity (Grant Camera in WebView)
        run: |
          cat << 'EOF' > android/app/src/main/java/com/eighthundredretail/arshooter/MainActivity.java
          package com.eighthundredretail.arshooter;

          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.content.pm.PackageManager;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import android.Manifest;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.CAMERA}, 101);
                  }
                  this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          request.grant(request.getResources());
                      }
                  });
              }
          }
          EOF

      - name: Build, Zipalign & Sign APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

          # Pinpoint the exact build-tools directory using absolute paths
          BUILD_TOOLS_DIR=$(find$ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          # Execute Zipalign
          $BUILD_TOOLS_DIR/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk

          # Execute Keytool via $JAVA_HOME$JAVA_HOME/bin/keytool -genkeypair -v -keystore release.jks -alias arshooter -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Thambi, OU=800Retail, O=AAG, L=Dubai, C=AE"

          # Execute Apksigner
          $BUILD_TOOLS_DIR/apksigner sign --ks release.jks --ks-pass pass:password123 --key-pass pass:password123 --out app-final.apk aligned.apk

      - name: Upload Validated APK
        uses: actions/upload-artifact@v4
        with:
          name: AR-Space-Shooter-Aligned-APK
          path: android/app-final.apk