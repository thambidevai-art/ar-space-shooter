name: Build AR Shooter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Capacitor App
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "ARSpaceShooter" "com.eighthundredretail.arshooter" --web-dir www
          npx cap add android

      - name: Configure AndroidManifest (Permissions & Orientation)
        run: |
          node -e '
            const fs = require("fs");
            const file = "android/app/src/main/AndroidManifest.xml";
            let content = fs.readFileSync(file, "utf8");
            
            // Add Permissions before <application>
            const perms = `
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" />
              <uses-feature android:name="android.hardware.gyroscope" />
            `;
            content = content.replace("<application", perms + "\n    <application");
            
            // Lock Landscape Orientation on MainActivity
            content = content.replace("android:name=\".MainActivity\"", "android:name=\".MainActivity\" android:screenOrientation=\"sensorLandscape\"");
            
            fs.writeFileSync(file, content);
          '

      - name: Configure MainActivity (Grant Camera in WebView)
        run: |
          cat << 'EOF' > android/app/src/main/java/com/eighthundredretail/arshooter/MainActivity.java
          package com.eighthundredretail.arshooter;

          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.content.pm.PackageManager;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import android.Manifest;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.CAMERA}, 101);
                  }
                  this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          request.grant(request.getResources());
                      }
                  });
              }
          }
          EOF

      - name: Build Android Debug APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AR-Space-Shooter-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk